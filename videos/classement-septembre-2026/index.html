      :root {
        --blue: #3761ad;
        --blue-deep: #24477f;
        --blue-ink: #1b3766;
        --yellow: #e2de3e;
        --orange: #ea653d;
        --white: #ffffff;
        --safe-x: 96px;
        --safe-y: 54px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--blue); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Poppins", sans-serif; color: var(--white); background: var(--blue); }

      .w { display: inline-block; white-space: nowrap; }
      .ch { display: inline-block; }

      /* ---------- fond ---------- */
      #bg { position: absolute; inset: 0; }
      .bg-base { position: absolute; inset: 0; background: radial-gradient(120% 95% at 50% 42%, #4572c2 0%, var(--blue) 52%, #2a4f8e 100%); }
      #dots { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

      /* ---------- caméra ---------- */
      #stage { position: absolute; inset: 0; transform-origin: 50% 50%; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .content { position: absolute; left: var(--safe-x); right: var(--safe-x); top: 120px; bottom: 112px; }

      /* ---------- logo ---------- */
      .logo { display: block; overflow: visible; }
      .logo-intro { position: absolute; left: 160px; top: 190px; width: 380px; height: 140px; }
      .logo-outro { width: 560px; height: 206px; margin: 70px auto 0; }

      /* ---------- intro ---------- */
      .shape { position: absolute; display: block; }
      .g-circle { width: 520px; height: 520px; border-radius: 50%; background: var(--yellow); right: 150px; top: 170px; }
      .g-ring { width: 300px; height: 300px; border-radius: 50%; border: 14px solid var(--white); right: 110px; top: 610px; }
      .g-square { width: 360px; height: 360px; background: var(--blue-deep); right: 230px; top: 420px; }
      .g-bar1 { left: 0; bottom: 150px; width: 1040px; height: 74px; background: var(--orange); transform-origin: 0 50%; }
      .g-bar2 { left: 0; bottom: 112px; width: 560px; height: 22px; background: var(--white); transform-origin: 0 50%; }
      .g-tri { width: 210px; height: 210px; background: var(--orange); right: 560px; top: 760px; clip-path: polygon(0 100%, 100% 100%, 100% 0); }
      .g-sq-small { width: 70px; height: 70px; background: var(--orange); right: 760px; top: 250px; }

      .intro-title .line { display: block; }

      .intro-rule { position: absolute; left: 160px; top: 772px; width: 320px; height: 12px; background: var(--orange); transform-origin: 0 50%; }

      /* ---------- chiffres ---------- */
      .kicker { display: inline-block; font-size: 22px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--white);
        padding: 6px 16px; border: 3px solid var(--orange); background: var(--blue-ink); border-radius: 6px; }
      .h2 { font-weight: 800; font-size: 76px; line-height: 1.05; letter-spacing: -0.015em; margin-top: 22px; }

      .stat { position: relative; padding-top: 30px; }
      .stat-line { position: absolute; left: 0; top: 0; width: 100%; height: 8px; background: rgba(255,255,255,0.2); }
      .stat-line i { display: block; width: 100%; height: 100%; background: var(--orange); transform-origin: 0 50%; }
      .stat-num { display: flex; width: max-content; font-weight: 800; font-size: 230px; line-height: 1; height: 230px; color: var(--yellow); letter-spacing: -0.03em; transform-origin: 50% 55%; }
      .digit { display: block; height: 230px; overflow: hidden; }
      .strip { display: block; }
      .strip span { display: block; height: 230px; }
      .stat-lab { font-weight: 600; font-size: 40px; line-height: 1.2; margin-top: 18px; max-width: 470px; }

      /* ---------- top ---------- */
      .top-bg8 { position: absolute; right: 30px; bottom: -330px; font-weight: 900; font-size: 1300px; line-height: 1; color: #3c68b5;

      .trophy-wrap { position: relative; width: 220px; height: 250px; flex: none; }
      .trophy { position: absolute; left: 0; top: 0; width: 220px; height: 250px; overflow: visible; }
      .rays { position: absolute; left: -170px; top: -155px; width: 560px; height: 560px; border-radius: 50%;
        background: repeating-conic-gradient(rgba(226,222,62,0.30) 0deg 9deg, rgba(226,222,62,0) 9deg 24deg);
        -webkit-mask-image: radial-gradient(circle, #000 18%, transparent 68%); mask-image: radial-gradient(circle, #000 18%, transparent 68%); }
      .top-big { font-weight: 800; font-size: 170px; line-height: 0.95; letter-spacing: -0.03em; white-space: nowrap; }
      .top-big .n8 { display: inline-block; color: var(--yellow); font-weight: 900; margin-right: 34px; transform-origin: 50% 60%; }
      .top-sub { font-weight: 700; font-size: 44px; letter-spacing: 0.32em; text-transform: uppercase; margin-top: 10px; }
      .top-card { position: relative; display: flex; align-items: center; height: 222px; padding: 0 60px 0 76px; background: rgba(27,55,102,0.72); border-radius: 18px; overflow: hidden; }
      .top-card .bar { position: absolute; left: 0; top: 0; width: 22px; height: 100%; background: var(--orange); transform-origin: 50% 100%; }
      .shine { position: absolute; top: -40px; left: 0; width: 220px; height: 340px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.22), rgba(255,255,255,0)); }
      .top-txt { flex: 1; position: relative; }
      .top-name { font-size: 96px; line-height: 1.05; letter-spacing: -0.015em; white-space: nowrap; }
      .top-name b { font-weight: 800; }
      .top-name em { font-style: normal; font-weight: 400; }
      .top-ag { font-size: 34px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 8px; opacity: 0.88; }
      .top-badge-wrap { position: relative; width: 184px; height: 184px; }
      .top-ring { position: absolute; inset: 0; border-radius: 50%; border: 8px solid var(--orange); }
      .top-badge { position: absolute; inset: 0; border-radius: 50%; background: var(--yellow); color: var(--blue-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .top-badge b { font-weight: 900; font-size: 104px; line-height: 0.9; }
      .top-badge span { font-weight: 700; font-size: 28px; letter-spacing: 0.08em; text-transform: uppercase; }
      .stamp { position: absolute; right: 0; top: 40px; display: inline-block; padding: 14px 28px; border: 5px solid var(--orange); color: var(--white); background: var(--blue-ink);

      /* ---------- en-tête des paliers (persistant) ---------- */

      .tier-sub { position: relative; height: 40px; margin-top: 8px; width: 700px; }
      .tier-sub span { position: absolute; left: 0; top: 0; font-weight: 600; font-size: 30px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0; white-space: nowrap; }
      .tier-page { margin-left: auto; font-weight: 700; font-size: 26px; letter-spacing: 0.2em; position: relative; width: 120px; height: 40px; }
      .tier-page span { position: absolute; right: 0; top: 0; opacity: 0; }

      /* ---------- cartes ---------- */
      .grid { position: absolute; left: 0; right: 0; display: grid; justify-content: center; }

      /* ---------- défilé ---------- */

      .cgroup { position: absolute; left: 0; top: 0; width: 1728px; height: 74px; padding: 22px 0 0 30px; border-top: 2px solid rgba(255,255,255,0.18); opacity: 0; transform-origin: 50% 50%; }

      .crow .nm { white-space: nowrap; line-height: 1.2; }
      .crow .nm b { font-weight: 800; }
      .crow .nm em { font-style: normal; font-weight: 400; }

      /* ---------- outro ---------- */
      .outro-copy { position: absolute; left: 0; right: 0; top: 200px; text-align: center; }
      .outro-title { font-weight: 800; font-size: 120px; line-height: 1.04; letter-spacing: -0.025em; }

      .outro-title .y { color: var(--yellow); }

      .o-bar { right: 0; bottom: 160px; width: 620px; height: 60px; background: var(--orange); transform-origin: 100% 50%; }
      .o-ring { width: 200px; height: 200px; border-radius: 50%; border: 12px solid var(--white); right: 150px; top: 560px; }
      .o-tri { width: 170px; height: 170px; background: var(--orange); left: 380px; bottom: 110px; clip-path: polygon(0 0, 100% 100%, 0 100%); }
      .o-sq { width: 80px; height: 80px; background: var(--blue-deep); right: 420px; bottom: 300px; }

      /* ---------- effets ---------- */
      #fx { position: absolute; inset: 0; z-index: 60; pointer-events: none; }
      #iris { position: absolute; inset: 0; --r: 0px;
        background: radial-gradient(circle at 50% 50%, transparent var(--r), var(--orange) calc(var(--r) + 1px), var(--orange) calc(var(--r) + 40px), var(--yellow) calc(var(--r) + 41px)); }
      .slab { position: absolute; top: -120px; height: 1320px; left: -200px; }
      .slab-y { width: 2500px; background: var(--yellow); }
      .slab-o { width: 2400px; background: var(--orange); }
      .slab-b { width: 2300px; background: var(--blue-deep); }
      #flash { position: absolute; inset: 0; background: #ffffff; opacity: 0; }
      #confetti { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

      /* ---------- HUD ---------- */
      #hud { position: absolute; inset: 0; pointer-events: none; z-index: 70; }
      .hud-txt { position: absolute; inset: 0; }
      .corner { position: absolute; width: 34px; height: 34px; border-color: rgba(255,255,255,0.75); border-style: solid; border-width: 0; }
      .c-tl { left: var(--safe-x); top: var(--safe-y); border-left-width: 3px; border-top-width: 3px; }
      .c-tr { right: var(--safe-x); top: var(--safe-y); border-right-width: 3px; border-top-width: 3px; }
      .c-bl { left: var(--safe-x); bottom: var(--safe-y); border-left-width: 3px; border-bottom-width: 3px; }
      .c-br { right: var(--safe-x); bottom: var(--safe-y); border-right-width: 3px; border-bottom-width: 3px; }
      .hud-t { position: absolute; top: calc(var(--safe-y) + 8px); font-size: 17px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.85; }
      .hud-tl { left: calc(var(--safe-x) + 50px); }
      .hud-tr { right: calc(var(--safe-x) + 50px); }
      .hud-tl i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--orange); margin-right: 12px; vertical-align: 1px; }
      .hud-b { position: absolute; bottom: calc(var(--safe-y) + 6px); font-size: 17px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; }
      .hud-sec { left: calc(var(--safe-x) + 50px); width: 700px; height: 26px; }
      .hud-sec span { position: absolute; left: 0; top: 0; white-space: nowrap; opacity: 0; }
      .hud-sec b { color: var(--yellow); margin-right: 14px; }
      .hud-prog { right: calc(var(--safe-x) + 50px); bottom: calc(var(--safe-y) + 14px); width: 300px; height: 4px; background: rgba(255,255,255,0.22); }
      .hud-prog-fill { display: block; width: 100%; height: 100%; background: var(--orange); transform-origin: 0 50%; }
    </style>

        tl.to("#beam-2", { rotation: -10, duration: 4.5, ease: "sine.inOut" }, TOP + 4.7);
        // « 8 ventes en septembre » : le chiffre s'écrase, le trophée tombe, les rayons tournent
        tl.fromTo("#top-n", { scale: 4.5, opacity: 0, filter: "blur(18px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "hfOut" }, TOP + 0.4);
        tl.fromTo("#top-n", { scale: 1 }, { scale: 1.12, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, TOP + 1.0);
        charIn(chars($("top-word")), TOP + 0.62, { stagger: 0.04 });
        charIn(chars($("top-sub")), TOP + 0.95, { stagger: 0.025, dur: 0.6 });
        tl.fromTo("#trophy", { y: -620, rotation: -24, scale: 0.7, opacity: 0, transformOrigin: "50% 100%" },
          { y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.75, ease: "hfBack" }, TOP + 0.3);
        tl.fromTo("#trophy", { rotation: 0 }, { rotation: -6, duration: 0.22, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, TOP + 1.05);
        tl.fromTo("#rays", { scale: 0, opacity: 0, rotation: -40 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.9, ease: "hfOut" }, TOP + 0.75);
        tl.to("#rays", { rotation: 70, duration: T.t6 - TOP - 1.65, ease: "sine.inOut" }, TOP + 1.65);
        bursts.push({ t: TOP + 1.0, x: 206, y: 230, n: 60, seed: 31, spread: 0.8 });
        const topCards = [];
        const cardGap = top.people.length > 2 ? 4 * B : 6 * B;
        top.people.forEach((p, i) => {
          const c = h("div", "top-card");
          const bar = h("div", "bar");
          const shine = h("div", "shine");
          const tx = h("div", "top-txt");
          const size = fit((s) => [[p.nom + " ", 800, s], [p.prenom, 400, s]], 92, 1260, 56);
          const nm = h("div", "top-name", `<b>${esc(p.nom)}</b> <em>${esc(p.prenom)}</em>`);
          nm.style.fontSize = size + "px";
          const ag = h("div", "top-ag", esc(p.agence));
          tx.append(nm, ag);
          const bw = h("div", "top-badge-wrap");
          const ring = h("div", "top-ring");
          const badge = h("div", "top-badge", `<b>${top.n}</b><span>ventes</span>`);
          bw.append(ring, badge);
          c.append(bar, tx, bw, shine);
          $("top-cards").appendChild(c);
          topCards.push(c);
          const nmChars = chars(nm);
          const at = TOP + 6 * B + i * cardGap;
          tl.fromTo(c, { scale: 1.35, opacity: 0, filter: "blur(14px)", rotationY: -14, transformPerspective: 1600 },
            { scale: 1, opacity: 1, filter: "blur(0px)", rotationY: 0, duration: 0.6, ease: "hfOut" }, at);
          tl.fromTo(bar, { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "hfOut" }, at + 0.1);
          charIn(nmChars, at + 0.12, { stagger: 0.03 });
          tl.fromTo(ag, { x: -30, opacity: 0 }, { x: 0, opacity: 0.88, duration: 0.6, ease: "hfOut" }, at + 0.4);
          tl.fromTo(badge, { scale: 0, rotation: -200 }, { scale: 1, rotation: 0, duration: 0.8, ease: "hfBack" }, at + 2 * B);
          tl.fromTo(ring, { scale: 0.7, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.9, ease: "hfOut" }, at + 2 * B + 0.15);
          tl.fromTo(shine, { x: -300 }, { x: 1800, duration: 1.1, ease: "hfInOut" }, at + 0.6);
        });
        const stampAt = TOP + 6 * B + top.people.length * cardGap;
        if (top.people.length > 1) {
          tl.fromTo("#top-stamp", { scale: 2.6, rotation: -24, opacity: 0 }, { scale: 1, rotation: -6, opacity: 1, duration: 0.5, ease: "hfBack" }, stampAt);
          bursts.push({ t: stampAt + 0.05, x: 1700, y: 500, n: 70, seed: 11 }, { t: stampAt + 0.05, x: 1700, y: 760, n: 70, seed: 23 });
          topCards.forEach((c, i) => tl.fromTo(c.querySelector(".shine"), { x: -300 }, { x: 1800, duration: 1.0, ease: "hfInOut", immediateRender: false }, stampAt + 0.2 + i * 0.12));
        } else $("top-stamp").style.display = "none";
        // sortie : volets obliques
        const T6 = T.t6;
        gsap.set(["#slab-b", "#slab-o", "#slab-y"], { x: -2900, skewX: -16 });
        ["#slab-b", "#slab-o", "#slab-y"].forEach((s, i) => {
          tl.fromTo(s, { x: -2900 }, { x: -150, duration: 0.5 - i * 0.05, ease: "hfIn", immediateRender: false }, T6 - 0.5 + i * 0.05);
          tl.to(s, { x: 2700, duration: 0.6, ease: "hfOut" }, T6 + 0.02 + (2 - i) * 0.06);
        });
        hudHide(T6 - 0.55, T6 + 0.7);

        // ================= 4. PALIERS (en-tête persistant) =================
        const mids = D.tiers.slice(1, 4);
        const crawlTiers = D.tiers.slice(4, 7); // 3, 2 et 1 vente : même défilé par agence
        const seq = [...mids, ...crawlTiers];
        const seqStart = [T.t6, T.t5, T.t4, T.t3, T.crawlA, T.crawlB];
        seq.forEach((t, i) => { const d = h("span", null, String(t.n)); if (i) d.style.opacity = 0; $("tb-strip").appendChild(d); });
        const subs = seq.map((t) => { const s = h("span", null, plural(t.people.length, "vendeur")); $("tsub").appendChild(s); return s; });
        const ttChars = chars($("tt"));
        tl.fromTo("#tb", { scale: 0, rotation: -220 }, { scale: 1, rotation: 0, duration: 0.8, ease: "hfBack" }, T6 + 0.15);
        charIn(ttChars, T6 + 0.3);
        tl.fromTo(subs[0], { y: 30, opacity: 0 }, { y: 0, opacity: 0.85, duration: 0.5, ease: "hfOut" }, T6 + 0.5);
        seq.forEach((t, i) => {
          section(seqStart[i], plural(t.n, "vente"));
          if (i === 0) return;
          const at = seqStart[i];
          // le badge « roule » au palier suivant
          const digs = $("tb-strip").children;
          tl.set(digs[i], { opacity: 1 }, at - 0.26);
          tl.to("#tb-strip", { y: -130 * i, duration: 0.6, ease: "hfInOut" }, at - 0.25);
          tl.set(digs[i - 1], { opacity: 0 }, at + 0.36);
          tl.fromTo("#tb", { scale: 1 }, { scale: 1.18, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at - 0.2);
          tl.to(subs[i - 1], { y: -30, opacity: 0, duration: 0.35, ease: "hfIn" }, at - 0.2);
          tl.fromTo(subs[i], { y: 30, opacity: 0 }, { y: 0, opacity: 0.85, duration: 0.5, ease: "hfOut" }, at + 0.1);
          if (t.n === 1) tl.to("#tt-s", { yPercent: -120, opacity: 0, rotation: 30, duration: 0.45, ease: "hfIn" }, at - 0.1);
        });

        const layouts = {
          1: { cols: 1, nom: 104, pre: 80, ag: 34, w: 1100, cardH: 330, pad: 64 },
          3: { cols: 3, nom: 62, pre: 50, ag: 26, w: 1728, cardH: 300, pad: 40 },
          6: { cols: 3, nom: 56, pre: 46, ag: 25, w: 1728, cardH: 230, pad: 36 },
          page: { cols: 3, nom: 44, pre: 38, ag: 21, w: 1728, cardH: 130, pad: 26 },
        };
        mids.forEach((tier, ti) => {
          const S = seqStart[ti], E = seqStart[ti + 1];
          const sec = $(`s-tier-${tier.n}`);
          const content = h("div", "content");
          sec.appendChild(content);
          const n = tier.people.length;
          const paged = n > 6;
          const L = paged ? layouts.page : layouts[n] || layouts[6];
          const half = Math.ceil(n / 2);
          const pages = paged ? [tier.people.slice(0, half), tier.people.slice(half)] : [tier.people];
          const gap = paged ? 14 : 32;
          const colW = (L.w - (L.cols - 1) * gap) / L.cols;
          const pageTimes = paged ? [S + 0.25, T.t3page2 + 0.05] : [S + 0.3];
          pages.forEach((list, pi) => {
            const grid = h("div", "grid");
            grid.style.gridTemplateColumns = `repeat(${L.cols}, ${colW}px)`;
            grid.style.gap = `${gap}px`;
            const rows = Math.ceil(list.length / L.cols);
            grid.style.top = paged ? "150px" : `${190 + Math.max(0, (658 - rows * L.cardH - (rows - 1) * gap) / 2)}px`;
            const cards = list.map((p) => {
              const c = h("div", "card");
              c.style.height = L.cardH + "px";
              c.style.padding = `0 ${L.pad - 10}px 0 ${L.pad}px`;
              const inner = colW - L.pad - (L.pad - 10);
              const nom = h("div", "nom", esc(p.nom)), pre = h("div", "pre", esc(p.prenom)), ag = h("div", "ag", esc(p.agence));
              nom.style.fontSize = fit((s) => [[p.nom, 800, s]], L.nom, inner) + "px";
              pre.style.fontSize = fit((s) => [[p.prenom, 400, s]], L.pre, inner) + "px";
              ag.style.fontSize = L.ag + "px";
              c.append(h("div", "bar"), nom, pre, ag);
              grid.appendChild(c);
              return { c, nomChars: chars(nom), pre, ag };
            });
            content.appendChild(grid);
            const at = pageTimes[pi];
            const stg = paged ? B / 2 : n === 1 ? 0 : B;
            cards.forEach(({ c, nomChars, pre, ag }, k) => {
              const ck = at + k * stg;
              tl.fromTo(c, { rotationX: -80, y: 90, opacity: 0, filter: "blur(10px)", transformPerspective: 1400, transformOrigin: "50% 0%" },
                { rotationX: 0, y: 0, opacity: 1, filter: "blur(0px)", duration: 0.75, ease: "hfOut" }, ck);
              tl.fromTo(c.firstChild, { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "hfOut" }, ck + 0.15);
              charIn(nomChars, ck + 0.12, { stagger: paged ? 0.015 : 0.025, dur: 0.55 });
              tl.fromTo(pre, { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "hfOut" }, ck + 0.3);
              tl.fromTo(ag, { x: -24, opacity: 0 }, { x: 0, opacity: 0.82, duration: 0.5, ease: "hfOut" }, ck + 0.36);
            });
            const out = (paged && pi === 0 ? T.t3page2 : E) - 0.6;
            cards.slice().reverse().forEach(({ c }, k) =>
              tl.to(c, { rotationX: 75, y: -70, opacity: 0, filter: "blur(8px)", duration: 0.45, ease: "hfIn" }, out + k * (paged ? 0.015 : 0.05)));
            if (paged) {
              const lab = $("tpage").children[pi];
              tl.fromTo(lab, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "hfOut" }, at);
              tl.to(lab, { y: -20, opacity: 0, duration: 0.3, ease: "hfIn" }, out + 0.1);
            }
          });
        });

        // ================= 5. DÉFILÉS =================
        const WIN_H = 1080 - 290 - 96;
        // regroupement par agence : l'agence à gauche, ses vendeurs sur 2 colonnes à droite
        const AG_W = 470, NCOL_W = 604, NCOL_GAP = 40, LINE_H = 74, GROUP_GAP = 30;
        const crawls = crawlTiers.map((tier, ci) => {
          const start = [T.t3, T.crawlA, T.crawlB][ci];
          const stop = [T.crawlA, T.crawlB, T.outro][ci];
          const groups = [];
          tier.people.forEach((p) => {
            const g = groups[groups.length - 1];
            if (g && g.agence === p.agence) g.people.push(p); else groups.push({ agence: p.agence, people: [p] });
          });
          const items = [];
          let y = 0;
          groups.forEach((g, gi) => {
            const lab = h("div", "cgroup", `<span>${esc(g.agence)}</span>`);
            $("crawl-win").appendChild(lab);
            items.push({ el: lab, x: 0, y0: y, h: LINE_H, k: items.length });
            g.people.forEach((p, j) => {
              const r = h("div", "crow");
              const size = fit((sz) => [[p.nom + " ", 800, sz], [p.prenom, 400, sz]], 46, NCOL_W - 40);
              const nm = h("div", "nm", `<b>${esc(p.nom)}</b> <em>${esc(p.prenom)}</em>`);
              nm.style.fontSize = size + "px";
              r.appendChild(nm);
              $("crawl-win").appendChild(r);
              items.push({ el: r, x: AG_W + (j % 2) * (NCOL_W + NCOL_GAP), y0: y + 14 + Math.floor(j / 2) * LINE_H, h: LINE_H, k: items.length });
            });
            y += 14 + Math.ceil(g.people.length / 2) * LINE_H + GROUP_GAP;
          });
          const contentH = y - GROUP_GAP;
          const off0 = Math.round(WIN_H * 0.3); // les premiers noms entrent par le bas de la fenêtre
          const dist = Math.max(0, contentH - WIN_H + 130 + off0);
          // un cran adouci tous les 4 temps : le défilement « respire » avec la musique
          const t0 = start + 1.4, t1 = stop - 1.2, step = 4 * B, d = 1.15;
          const steps = [];
          for (let t = t0; t + d <= t1 + 1e-6; t += step) steps.push(t);
          return { start, stop, items, dist, steps, d, off0 };
        });
        function crawlFrame(t) {
          crawls.forEach((c) => {
            const live = t >= c.start - 0.05 && t <= c.stop + 0.3;
            let s = 0;
            if (live) for (const tk of c.steps) s += eInOut(clamp((t - tk) / c.d));
            const off = c.off0 - c.dist * (c.steps.length ? s / c.steps.length : 0);
            c.items.forEach((r) => {
              if (!live) { r.el.style.opacity = 0; return; }
              const ein = eOut(clamp((t - (c.start + 0.1 + 0.05 * r.k)) / 0.8));
              const eout = eIn(clamp((t - (c.stop - 0.65 + 0.015 * r.k)) / 0.5));
              const y = r.y0 + off + (1 - ein) * 80 - eout * 180;
              const rel = clamp((y + r.h / 2 - WIN_H / 2) / (WIN_H / 2), -1.3, 1.3);
              // bascule 3D seulement en bord de fenêtre : les noms restent bien droits au centre
              const rx = -Math.sign(rel) * Math.max(0, Math.abs(rel) - 0.55) * 45 + (1 - ein) * -60;
              const sc = 1 - 0.08 * Math.max(0, Math.abs(rel) - 0.55);
              const edge = clamp((1.15 - Math.abs(rel)) * 3);
              r.el.style.transform = `perspective(1400px) translate3d(${r.x}px, ${y.toFixed(2)}px, 0) rotateX(${rx.toFixed(2)}deg) scale(${sc.toFixed(4)})`;
              r.el.style.opacity = (ein * (1 - eout) * edge).toFixed(3);
              r.el.style.filter = eout > 0.01 ? `blur(${(eout * 8).toFixed(1)}px)` : "none";
            });
          });
        }
        // le retour de la musique : flash
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.55, duration: 0.08, ease: "power2.out", immediateRender: false }, T.crawlB - 0.02);
        tl.to("#flash", { opacity: 0, duration: 0.6, ease: "power2.out" }, T.crawlB + 0.08);

        // ================= 6. OUTRO =================
        const O = T.outro;
        section(O, "Bravo");
        tl.to("#tb", { scale: 0, rotation: 200, duration: 0.5, ease: "hfIn" }, O - 0.55);
        charOut(ttChars, O - 0.6);
        tl.to(subs[subs.length - 1], { opacity: 0, y: -20, duration: 0.3, ease: "hfIn" }, O - 0.5);
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.5, duration: 0.08, ease: "power2.out", immediateRender: false }, O - 0.02);
        tl.to("#flash", { opacity: 0, duration: 0.6, ease: "power2.out" }, O + 0.08);
        [["#o-circle", { scale: 0 }], ["#o-ring", { scale: 2.4 }], ["#o-bar", { scaleX: 0 }], ["#o-tri", { x: -200, y: 200, rotation: -60 }], ["#o-sq", { scale: 0, rotation: 135 }]]
          .forEach(([s, f], i) => tl.fromTo(s, Object.assign({ opacity: 0 }, f), { opacity: 1, scale: 1, scaleX: 1, x: 0, y: 0, rotation: 0, duration: 1.0, ease: "hfOut" }, O + 0.05 + i * 0.07));
        const ot1 = chars($("ot-1")), ot2 = chars($("ot-2"));
        tl.fromTo(ot1, { scale: 2.4, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "hfOut", stagger: 0.05 }, O + 0.15);
        charIn(ot2, O + 4 * B, { stagger: 0.03 });
        bursts.push({ t: O + 4 * B + 0.5, x: 960, y: 420, n: 150, seed: 7, spread: 1.2 });
        logoIn(document.querySelector(".logo-outro"), T.tail);
        tl.to("#o-circle", { x: 26, y: 18, duration: 3.5, ease: "sine.inOut" }, O + 1.3);
        tl.to("#o-ring", { x: -20, y: 14, duration: 3.5, ease: "sine.inOut" }, O + 1.3);
        tl.to("#o-tri", { rotation: 8, duration: 3.5, ease: "sine.inOut" }, O + 1.3);
        tl.to("#o-circle", { x: 0, y: 0, duration: 3.0, ease: "sine.inOut" }, O + 4.8);
        tl.to("#o-ring", { x: 0, y: 0, duration: 3.0, ease: "sine.inOut" }, O + 4.8);
        tl.to("#o-tri", { rotation: 0, duration: 3.0, ease: "sine.inOut" }, O + 4.8);

        // ================= moteur image par image (déterministe) =================
        const dctx = $("dots").getContext("2d");
        const cctx = $("confetti").getContext("2d");
        const downs = D.beats.filter((b) => b[2]);
        function beatEnv(t) {
          let e = 0;
          for (const [bt, s, dn] of D.beats) { const a = t - bt; if (a >= 0 && a < 0.7) e = Math.max(e, s * (dn ? 1.5 : 1) * Math.exp(-a * 9)); }
          return e;
        }
        function energy(t) { // pont calme : décor plus discret
          if (t >= T.crawlA && t < T.crawlB) return 0.45;
          if (t < T.figures) return 0.6;
          return 1;
        }
        function drawDots(t) {
          dctx.clearRect(0, 0, 1920, 1080);
          const env = beatEnv(t) * energy(t);
          const ox = 22 * Math.sin(t * 0.11), oy = 22 * Math.sin(t * 0.07 + 1);
          const rip = downs.filter((b) => t - b[0] >= 0 && t - b[0] < 2.2).slice(-2);
          dctx.fillStyle = "#ffffff";
          for (let gx = -1; gx < 42; gx++) for (let gy = -1; gy < 24; gy++) {
            const x = gx * 48 + 24 + ox, y = gy * 48 + 24 + oy;
            let boost = 0;
            for (const [bt] of rip) {
              const a = t - bt, dd = Math.hypot(x - 960, y - 540);
              boost += Math.exp(-Math.pow((dd - a * 1100) / 110, 2)) * Math.exp(-a * 1.3) * energy(t);
            }
            const rad = 2.2 + 3.2 * boost + 0.8 * env;
            dctx.globalAlpha = Math.min(0.75, 0.13 + 0.42 * boost + 0.08 * env);
            dctx.beginPath(); dctx.arc(x, y, rad, 0, Math.PI * 2); dctx.fill();
          }
          dctx.globalAlpha = 1;
        }
        // confettis : trajectoires analytiques (gravité + frottement)
        const COLORS = ["#ea653d", "#e2de3e", "#ffffff", "#ea653d", "#e2de3e"];
        bursts.forEach((b) => {
          const rnd = mulberry32(b.seed);
          b.p = Array.from({ length: b.n }, () => {
            const ang = -Math.PI / 2 + (rnd() - 0.5) * Math.PI * (b.spread || 0.9);
            const sp = 900 + rnd() * 1300;
            return { vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, w: 10 + rnd() * 10, hh: 6 + rnd() * 6, r0: rnd() * 6.28, vr: (rnd() - 0.5) * 14, fl: 6 + rnd() * 10, c: COLORS[Math.floor(rnd() * COLORS.length)], life: 2.2 + rnd() * 0.8 };
          });
        });
        function drawConfetti(t) {
          cctx.clearRect(0, 0, 1920, 1080);
          const active = bursts.some((b) => t >= b.t && t <= b.t + 3.2);
          cctx.canvas.style.visibility = active ? "visible" : "hidden";
          if (!active) return;
          const k = 1.7, g = 2100;
          for (const b of bursts) {
            const a0 = t - b.t; if (a0 < 0 || a0 > 3.2) continue;
            for (const p of b.p) {
              if (a0 > p.life) continue;
              const f = (1 - Math.exp(-k * a0)) / k;
              const x = b.x + p.vx * f, y = b.y + (p.vy + g / k) * f - (g / k) * a0;
              cctx.save();
              cctx.globalAlpha = clamp((p.life - a0) / 0.5);
              cctx.translate(x, y); cctx.rotate(p.r0 + p.vr * a0); cctx.scale(Math.cos(a0 * p.fl), 1);
              cctx.fillStyle = p.c; cctx.fillRect(-p.w / 2, -p.hh / 2, p.w, p.hh);
              cctx.restore();
            }
          }
        }
        function frame(t) {
          const tt = Math.min(t, FREEZE);
          drawDots(tt); drawConfetti(tt); crawlFrame(tt);
        }
        const clock = { t: 0 };
        tl.fromTo(clock, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => frame(clock.t) }, 0);
        frame(0);

        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      }

      Promise.all([400, 600, 700, 800, 900].map((w) => document.fonts.load(`${w} 40px Poppins`))).then(build);
    </script>
  </body>
