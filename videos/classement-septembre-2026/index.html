      CustomEase.create("hfBack", "0.34,1.56,0.64,1");

      const $ = (id) => document.getElementById(id);
      const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      const plural = (n, w) => `${n} ${w}${n > 1 ? "s" : ""}`;

      const ctx = document.createElement("canvas").getContext("2d");
      function measure(parts) { // parts: [[text, weight, size], ...]
        let w = 0;
        for (const [t, wt, s] of parts) { ctx.font = `${wt} ${s}px Poppins`; w += ctx.measureText(t).width; }
        return w;
      }
      // Plus grande taille ≤ size (et ≥ min, 36 px) qui tient dans maxW.
      function fit(partsAt, size, maxW, min = 36) {
        let s = size;
        while (s > min && measure(partsAt(s)) > maxW) s -= 1;
        return s;
      }

      function build() {
        const tl = gsap.timeline({ paused: true });
        const SECTIONS = [];

        // ---------- volets ----------
        function wipe(at, kind) {
          // panneaux dans l'ordre d'arrivée ; le dernier passe au-dessus et repart en premier
          const panels = kind === "orange" ? ["wp-b", "wp-y", "wp-o"] : ["wp-b"];
          const lead = kind === "orange" ? 0.5 : 0.42;
          panels.forEach((id, i) => {
            const d = i * 0.06;
            tl.fromTo("#" + id, { xPercent: -101 }, { xPercent: 0, duration: lead - d, ease: "hfInOut", immediateRender: false }, at - lead + d);
            tl.to("#" + id, { xPercent: 101, duration: 0.55, ease: "hfInOut" }, at + 0.02 + (panels.length - 1 - i) * 0.05);
          });
          panels.forEach((id, z) => tl.set("#" + id, { zIndex: z }, at - lead - 0.01));
          // les textes du cadre s'effacent le temps du volet
          tl.to("#hud-txt", { opacity: 0, duration: 0.15, ease: "power2.out" }, at - lead - 0.05);
          tl.to("#hud-txt", { opacity: 1, duration: 0.3, ease: "power2.out" }, at + 0.55);
        }
        gsap.set(["#wp-o", "#wp-y", "#wp-b"], { xPercent: -101 });

        // ---------- fond : dérive lente, figée avant la dernière seconde ----------

        tl.to("#bg-dots", { x: 0, y: -96, duration: 37, ease: "sine.inOut" }, 34);
        tl.fromTo("#bg-glow", { x: 0, y: 0 }, { x: -260, y: 120, duration: 35, ease: "sine.inOut" }, 0);
        tl.to("#bg-glow", { x: 120, y: 40, duration: 36, ease: "sine.inOut" }, 35);

        // ---------- HUD : section + progression par paliers ----------
        const hudSec = $("hud-sec");
        function section(at, idx, label) {
          const sp = h("span", null, `<b>${String(idx).padStart(2, "0")}</b>${label}`);
          hudSec.appendChild(sp);
          SECTIONS.push(sp);
          tl.set(sp, { opacity: 1 }, at);
          if (SECTIONS.length > 1) tl.set(SECTIONS[SECTIONS.length - 2], { opacity: 0 }, at);
          tl.to("#hud-prog", { scaleX: (at + 1) / T.end, duration: 0.8, ease: "hfInOut" }, at + 0.3);
        }
        gsap.set("#hud-prog", { scaleX: 0 });

        // ================= 1. INTRO =================
        section(0.0, 1, "Introduction");
        tl.fromTo("#g-square", { scale: 0, rotation: -40 }, { scale: 1, rotation: 12, duration: 1.1, ease: "hfOut" }, 0.1);
        tl.fromTo("#g-circle", { scale: 0 }, { scale: 1, duration: 1.0, ease: "hfOut" }, 0.2);
        tl.fromTo("#g-bar1", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "hfOut" }, 0.3);
        tl.fromTo("#g-bar2", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "hfOut" }, 0.42);
        tl.fromTo("#g-ring", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 0.9, duration: 0.9, ease: "hfOut" }, 0.5);
        tl.fromTo("#g-tri", { x: 160, y: 160, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.9, ease: "hfOut" }, 0.58);
        tl.fromTo("#g-sq-small", { scale: 0, rotation: 90 }, { scale: 1, rotation: 0, duration: 0.8, ease: "hfBack" }, 0.66);
        tl.fromTo("#intro-logo", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "hfOut" }, 0.6);
        ["#it-1", "#it-2", "#it-3"].forEach((s, i) =>
          tl.fromTo(s, { yPercent: 110 }, { yPercent: 0, duration: 0.85, ease: "hfOut" }, 0.85 + i * 0.2));
        tl.fromTo("#intro-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "hfOut" }, 1.55);
        // respiration légère des formes
        tl.to("#g-circle", { x: -24, y: 18, duration: 2.0, ease: "sine.inOut" }, 1.5);
        tl.to("#g-square", { rotation: 20, duration: 2.0, ease: "sine.inOut" }, 1.5);
        wipe(T.figures, "orange");

        // ================= 2. CHIFFRES CLÉS =================
        section(T.figures, 2, "Chiffres clés");
        const F = T.figures;
        tl.fromTo("#fg-kicker", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "hfOut" }, F + 0.35);
        tl.fromTo("#fg-title", { yPercent: 110 }, { yPercent: 0, duration: 0.8, ease: "hfOut" }, F + 0.45);
        const statDefs = [
          [D.stats.count, "vendeurs classés"],
          [D.stats.total, "ventes signées sur le mois"],
          [D.stats.max, "ventes : record individuel du mois"],
        ];
        statDefs.forEach(([val, lab], i) => {
          const st = h("div", "stat");
          const line = h("div", "stat-line"); const fill = h("i"); line.appendChild(fill);
          const num = h("div", "stat-num", "0"); const l = h("div", "stat-lab", esc(lab));
          st.append(line, num, l); $("stats").appendChild(st);
          const at = F + 0.85 + i * 0.45;
          tl.fromTo(fill, { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "hfOut" }, at);
          tl.fromTo([num, l], { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "hfOut", stagger: 0.08 }, at);
          const o = { v: 0 };
          tl.fromTo(o, { v: 0 }, { v: val, duration: 1.7, ease: "power3.out", onUpdate: () => { num.textContent = Math.round(o.v); } }, at + 0.05);
        });
        wipe(T.top, "orange");

        // ================= 3. TOP =================
        const top = D.tiers[0];
        section(T.top, 3, `Top · ${plural(top.n, "vente")}`);
        const TP = T.top;
        $("top-bg8").textContent = top.n;
        $("top-title").textContent = `${plural(top.n, "vente")} en septembre`;
        tl.fromTo("#top-bg8", { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 1.6, ease: "hfOut" }, TP + 0.3);
        tl.fromTo("#top-kicker", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "hfOut" }, TP + 0.4);
        tl.fromTo("#top-title", { yPercent: 110 }, { yPercent: 0, duration: 0.8, ease: "hfOut" }, TP + 0.5);
        const topGap = top.people.length > 2 ? 1.1 : 1.6;
        top.people.forEach((p, i) => {
          const c = h("div", "top-card");
          const bar = h("div", "bar");
          const tx = h("div", "top-txt");
          const size = fit((s) => [[p.nom + " ", 800, s], [p.prenom, 400, s]], 96, 1240, 56);
          tx.append(h("div", "top-name", `<b>${esc(p.nom)}</b> <span>${esc(p.prenom)}</span>`), h("div", "top-ag", esc(p.agence)));
          tx.firstChild.style.fontSize = size + "px";
          const bw = h("div", "top-badge-wrap");
          const ring = h("div", "top-ring");
          const badge = h("div", "top-badge", `<b>${top.n}</b><span>ventes</span>`);
          bw.append(ring, badge);
          c.append(bar, tx, bw);
          $("top-cards").appendChild(c);
          const at = TP + 1.0 + i * topGap;
          tl.fromTo(c, { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.9, ease: "hfOut" }, at);
          tl.fromTo(bar, { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: "hfOut" }, at + 0.15);
          tl.fromTo(badge, { scale: 0, rotation: -25 }, { scale: 1, rotation: 0, duration: 0.7, ease: "hfBack" }, at + 0.45);
          tl.fromTo(ring, { scale: 0.7, opacity: 1 }, { scale: 1.45, opacity: 0, duration: 0.9, ease: "hfOut" }, at + 0.55);
        });
        if (top.people.length > 1) {
          tl.fromTo("#top-stamp", { scale: 1.8, rotation: -14, opacity: 0 }, { scale: 1, rotation: -6, opacity: 1, duration: 0.55, ease: "hfBack" },
            TP + 1.0 + (top.people.length - 1) * topGap + 1.3);
        } else {
          $("top-stamp").style.display = "none";
        }

        wipe(T.t6, "blue");

        // ================= 4. PALIERS INTERMÉDIAIRES =================
        const layouts = {
          // n vendeurs -> colonnes, tailles (NOM, prénom, agence), hauteur carte
          1: { cols: 1, nom: 104, pre: 80, ag: 34, w: 1100, cardH: 330, pad: 64 },
          3: { cols: 3, nom: 62, pre: 50, ag: 26, w: 1728, cardH: 300, pad: 40 },
          6: { cols: 3, nom: 56, pre: 46, ag: 25, w: 1728, cardH: 230, pad: 36 },
          page: { cols: 3, nom: 44, pre: 38, ag: 21, w: 1728, cardH: 130, pad: 26 },
        };
        const tierStarts = { 1: T.t6, 2: T.t5, 3: T.t4, 4: T.t3 };
        const tierEnds = { 1: T.t5, 2: T.t4, 3: T.t3, 4: T.crawl };
        const midTiers = D.tiers.slice(1, 5);
        midTiers.forEach((tier, ti) => {
          const S = tierStarts[ti + 1], E = tierEnds[ti + 1];
          section(S, 4 + ti, plural(tier.n, "vente"));
          const sec = $(`s-tier-${tier.n}`);
          const content = h("div", "content");
          const head = h("div", "tier-head");
          const badge = h("div", "tier-badge", tier.n);
          const ttl = h("div");
          ttl.append(h("div", "tier-title", tier.n > 1 ? "ventes" : "vente"), h("div", "tier-sub", plural(tier.people.length, "vendeur")));
          head.append(badge, ttl);
          content.appendChild(head);
          sec.appendChild(content);

          tl.fromTo(badge, { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.7, ease: "hfBack" }, S + 0.3);
          tl.fromTo(ttl, { x: -50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "hfOut" }, S + 0.42);

          const n = tier.people.length;
          const paged = n > 6;
          const L = paged ? layouts.page : layouts[n] || layouts[6];
          const pages = paged ? [tier.people.slice(0, Math.ceil(n / 2)), tier.people.slice(Math.ceil(n / 2))] : [tier.people];
          const gap = paged ? 14 : 32;
          const colW = (L.w - (L.cols - 1) * gap) / L.cols;
          const pageTimes = paged ? [S + 0.7, T.t3page2] : [S + 0.75];
          let pageInd = null;
          if (paged) { pageInd = h("div", "tier-page"); head.appendChild(pageInd); }

          pages.forEach((list, pi) => {
            const grid = h("div", "grid");
            grid.style.gridTemplateColumns = `repeat(${L.cols}, ${colW}px)`;
            grid.style.gap = `${gap}px`;
            grid.style.top = paged ? "150px" : "190px";
            grid.style.justifyContent = "center";
            const rows = Math.ceil(list.length / L.cols);
            if (!paged) {
              const freeH = 848 - 190;
              grid.style.top = `${190 + Math.max(0, (freeH - rows * L.cardH - (rows - 1) * gap) / 2)}px`;
            }
            const cards = list.map((p) => {
              const c = h("div", "card");
              c.style.height = L.cardH + "px";
              c.style.padding = `0 ${L.pad - 10}px 0 ${L.pad}px`;
              c.style.display = "flex"; c.style.flexDirection = "column"; c.style.justifyContent = "center";
              const inner = colW - L.pad - (L.pad - 10);
              const ns = fit((s) => [[p.nom, 800, s]], L.nom, inner);
              const ps = fit((s) => [[p.prenom, 400, s]], L.pre, inner);
              c.append(h("div", "bar"), h("div", "nom", esc(p.nom)), h("div", "pre", esc(p.prenom)), h("div", "ag", esc(p.agence)));
              c.children[1].style.fontSize = ns + "px";
              c.children[2].style.fontSize = ps + "px";
              c.children[3].style.fontSize = L.ag + "px";
              grid.appendChild(c);
              return c;
            });
            content.appendChild(grid);
            const at = pageTimes[pi];
            const stg = paged ? 0.07 : n === 1 ? 0 : n <= 3 ? 0.3 : 0.18;
            if (pi > 0) gsap.set(cards, { opacity: 0 });
            cards.forEach((c, k) => {
              tl.fromTo(c, { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "hfOut", immediateRender: pi === 0 }, at + k * stg);
              tl.fromTo(c.firstChild, { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "hfOut" }, at + k * stg + 0.12);
            });
            if (paged) {
              const lab = h("span", null, `${pi + 1} / ${pages.length}`);
              pageInd.appendChild(lab);
              tl.set(lab, { opacity: 1 }, at);
              if (pi > 0) tl.set(pageInd.children[pi - 1], { opacity: 0 }, at);
              if (pi < pages.length - 1) {
                const out = pageTimes[pi + 1] - 0.5;
                cards.forEach((c, k) => tl.to(c, { y: -40, opacity: 0, duration: 0.4, ease: "hfInOut" }, out + k * 0.012));
              }
            }
          });
          wipe(E, ti === midTiers.length - 1 ? "orange" : "blue");
        });

        // ================= 5. DÉFILÉ FINAL =================
        const crawlTiers = D.tiers.slice(5);
        const CR = T.crawl;
        section(CR, 8, crawlTiers.map((t) => plural(t.n, "vente")).join(" · "));
        const track = $("crawl-track");
        const colW = (1728 - 2 * 32) / 3;
        const firstRows = [];
        crawlTiers.forEach((tier, ci) => {
          const s = h("div", "crawl-sec");
          const head = h("div", "crawl-head");
          const ttl = h("div");
          ttl.append(h("div", "tier-title", tier.n > 1 ? "ventes" : "vente"), h("div", "tier-sub", plural(tier.people.length, "vendeur")));
          head.append(h("div", "tier-badge", tier.n), ttl);
          const g = h("div", "crawl-grid");
          tier.people.forEach((p, k) => {
            const r = h("div", "crow");
            const size = fit((sz) => [[p.nom + " ", 800, sz], [p.prenom, 400, sz]], 40, colW - 40);
            const nm = h("div", "nm", `<b>${esc(p.nom)}</b> <span>${esc(p.prenom)}</span>`);
            nm.style.fontSize = size + "px";
            r.append(nm, h("div", "ag", esc(p.agence)));
            g.appendChild(r);
            if (ci === 0 && k < 15) firstRows.push(r);
          });
          s.append(head, g);
          track.appendChild(s);
          if (ci === 0) firstRows.unshift(head);
        });
        tl.fromTo(firstRows, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "hfOut", stagger: 0.05 }, CR + 0.35);
        // défilement par crans doux (jamais linéaire) : ~1 rangée de 3 noms par cran
        const winH = 1080 - 112 - 100;
        const dist = Math.max(0, track.offsetHeight - winH);
        const t0 = CR + 1.9, t1 = T.outro - 1.0;
        const nSteps = Math.max(1, Math.round(dist / 100));
        const period = (t1 - t0) / nSteps;
        const move = Math.min(0.85, period * 0.6);
        for (let k = 0; k < nSteps; k++) {
          tl.to(track, { y: -dist * (k + 1) / nSteps, duration: move, ease: "hfInOut" }, t0 + k * period);
        }
        tl.to(track, { opacity: 0, duration: 0.3, ease: "power2.in" }, T.outro - 0.5);
        wipe(T.outro, "orange");

        // ================= 6. OUTRO =================
        const O = T.outro;
        section(O, 9, "Bravo");
        tl.fromTo("#o-circle", { scale: 0 }, { scale: 1, duration: 1.0, ease: "hfOut" }, O + 0.25);
        tl.fromTo("#o-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "hfOut" }, O + 0.35);
        tl.fromTo("#o-ring", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.9, ease: "hfOut" }, O + 0.45);
        tl.fromTo("#o-tri", { x: -120, y: 120, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.9, ease: "hfOut" }, O + 0.55);
        tl.fromTo("#ot-1", { yPercent: 110 }, { yPercent: 0, duration: 0.85, ease: "hfOut" }, O + 0.4);
        tl.fromTo("#ot-2", { yPercent: 110 }, { yPercent: 0, duration: 0.85, ease: "hfOut" }, O + 0.65);
        tl.fromTo("#outro-logo", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "hfOut" }, O + 1.15);
        // tout est posé avant T.end - 1 s : la dernière seconde reste fixe pour le raccord.

        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      }

      Promise.all([400, 600, 700, 800, 900].map((w) => document.fonts.load(`${w} 40px Poppins`))).then(build);
    </script>
  </body>
</html>
